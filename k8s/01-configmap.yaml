apiVersion: v1
kind: ConfigMap
metadata:
  name: makhal-reader-config
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
data:
  # SQLite lives on the PVC mounted at /data.
  DB_PATH: /data/makhal.db

  # Plain HTTP behind the LoadBalancer; the session cookie is not Secure.
  HTTPS_ONLY: "false"

  # Same-origin via the web proxy, so no CORS origin is needed.
  CORS_ORIGIN: ""

  FETCH_INTERVAL_MINUTES: "720"
  MAX_NEW_ARTICLES_PER_FEED: "5"
  MAX_ARTICLE_AGE_DAYS: "7"
  SCORE_DELAY_SECONDS: "2.0"
  SCORING_CONCURRENCY: "1"
  PREFERENCE_CACHE_SECONDS: "600"
  MAX_ARTICLES_PER_FEED: "200"
  ARTICLE_RETENTION_DAYS: "90"

  # LLM providers. Empty values disable a provider; set LLM_BASE_URL for an
  # OpenAI-compatible endpoint, or put OPENROUTER_API_KEY in the Secret.
  # For an in-cluster Ollama, use e.g. http://ollama.ollama.svc.cluster.local:11434.
  LLM_BASE_URL: ""
  LLM_MODEL: ""
  OLLAMA_URL: ""
  OLLAMA_MODEL: "mistral"
  SCORER_MODEL: "google/gemini-flash-1.5"
