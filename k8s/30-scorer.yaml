apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorer
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: scorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: makhal-reader
      app.kubernetes.io/component: scorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: makhal-reader
        app.kubernetes.io/component: scorer
    spec:
      containers:
        - name: scorer
          image: makhal-reader/scorer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: makhal-reader-config
            - secretRef:
                name: makhal-reader-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: scorer
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: scorer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: scorer
  ports:
    - name: http
      port: 8002
      targetPort: http
