apiVersion: apps/v1
kind: Deployment
metadata:
  name: poller
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: poller
spec:
  # Exactly one scheduler: duplicate pollers would double-ingest feeds.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: makhal-reader
      app.kubernetes.io/component: poller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: makhal-reader
        app.kubernetes.io/component: poller
    spec:
      containers:
        - name: poller
          image: makhal-reader/poller:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: makhal-reader-config
            - secretRef:
                name: makhal-reader-secrets
