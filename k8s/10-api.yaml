apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: makhal-reader-data
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: api
  annotations:
    # ArgoCD: never prune the SQLite volume if this file is removed from Git.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: api
spec:
  # SQLite + RWO PVC: never run two API pods against the same database.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: makhal-reader
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: makhal-reader
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: makhal-reader/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: makhal-reader-config
            - secretRef:
                name: makhal-reader-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: makhal-reader-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
