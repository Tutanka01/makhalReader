apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: makhal-reader
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: makhal-reader
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: makhal-reader/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
