apiVersion: apps/v1
kind: Deployment
metadata:
  name: extractor
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: extractor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: makhal-reader
      app.kubernetes.io/component: extractor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: makhal-reader
        app.kubernetes.io/component: extractor
    spec:
      containers:
        - name: extractor
          image: makhal-reader/extractor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: makhal-reader-config
            - secretRef:
                name: makhal-reader-secrets
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: extractor
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: extractor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: extractor
  ports:
    - name: http
      port: 8001
      targetPort: http
