# Same-origin reverse proxy: /api and /auth -> api, everything else -> frontend.
# Unlike nginx/npm.conf (Docker DNS resolver), this config resolves the Service
# names once at startup, so the Services must exist in the same namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: makhal-reader-nginx
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: web
data:
  default.conf: |
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # SSE (/api/stream) and streaming Ask AI responses.
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /auth/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: makhal-reader
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: makhal-reader
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: nginx:1.30.4-alpine3.24
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap:
            name: makhal-reader-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: web
spec:
  # Classic L4 LoadBalancer, HTTP only. No Ingress, no TLS.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: makhal-reader
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
