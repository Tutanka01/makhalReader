# CHANGE BOTH VALUES BEFORE DEPLOYING.
# They are placeholders only; never expose the LoadBalancer with these defaults.
# AUTH_PASSWORD is required by the API at startup.
# API_SECRET must be identical for api, poller and scorer.
apiVersion: v1
kind: Secret
metadata:
  name: makhal-reader-secrets
  namespace: makhal-reader
  labels:
    app.kubernetes.io/name: makhal-reader
type: Opaque
stringData:
  AUTH_PASSWORD: "change_me_to_a_strong_password"
  API_SECRET: "change_me_internal_secret"
  OPENROUTER_API_KEY: ""
  LLM_API_KEY: ""
