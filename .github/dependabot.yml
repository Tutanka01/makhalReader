version: 2

# One grouped PR per ecosystem for minor/patch bumps. Major bumps (and Python
# minor bumps of the base images) are ignored: they need a deliberate upgrade.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directories:
      - "/backend/api"
      - "/backend/extractor"
      - "/backend/poller"
      - "/backend/scorer"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - "/backend/api"
      - "/backend/extractor"
      - "/backend/poller"
      - "/backend/scorer"
      - "/frontend"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
